services:
  - type: web
    name: ecojac-api
    runtime: docker
    plan: free
    envVars:
      - key: APP_KEY
        sync: false # Recomendo gerar uma nova no painel do Render ou colar a sua
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: TRUSTED_PROXIES
        value: "*"
